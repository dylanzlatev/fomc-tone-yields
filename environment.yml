name: ftyields
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26
  - libblas=*=*openblas   # MKL delay-loads DLLs that fail unless Library/bin is on PATH (crash 0xc06d007f)
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - matplotlib>=3.8
  - pyarrow>=14
  - pyyaml>=6.0
  - tqdm>=4.66
  - requests>=2.31
  - pandas-datareader>=0.10
  - pytest>=7.4
  - pre-commit>=3.5
  - tectonic>=0.15
  - openpyxl>=3.1
  - lxml>=5.0
  - beautifulsoup4>=4.12
  - html5lib>=1.1
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      # torch>=2.6: transformers refuses to torch.load .bin weights on older torch (CVE-2025-32434)
      - torch==2.6.0
      - transformers>=4.44,<5   # stay on the 4.x API
      - datasets>=2.20
      - huggingface-hub>=0.24
      - accelerate>=0.33
