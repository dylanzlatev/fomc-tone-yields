# Single home for every project parameter. Code must read values from here
# (via ftyields.config.load_config), never hard-code them.
# Mark undecided items with "# TBD (phase N)".

# Interpreter for the project conda env (always run the project with this).
python: C:/Users/dylan/anaconda3/envs/ftyields/python.exe

seed: 20261030

# All paths are relative to the repo root (the directory containing this file).
paths:
  src: src
  codebook: codebook
  labels: labels
  labels_pilot: labels/pilot
  labels_gold: labels/gold
  labels_human: labels/human
  labels_train: labels/train
  labels_batches: labels/batches
  labels_out: labels/out
  data: data
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  results: results
  results_tables: results/tables
  results_figures: results/figures
  results_macros: results/macros
  paper: paper
  tests: tests
  models_dir: models   # gitignored

sample:
  start: 2000-01-01
  end: 2025-12-31

# FRED constant-maturity Treasury yields (percent, daily).
fred:
  series:
    DGS1MO: 1M
    DGS3MO: 3M
    DGS1: 1Y
    DGS2: 2Y
    DGS5: 5Y
    DGS7: 7Y
    DGS10: 10Y
    DGS20: 20Y
    DGS30: 30Y
  # Series breaks: any change y(t) - y(s) whose interval (s, t] contains one of these
  # dates is set to NaN for the listed columns (and the factors built from them).
  # 2002-02-19 .. 2006-02-08 the 30Y bond was suspended and DGS30 is Treasury's
  # extrapolated 30-year rate (different construction; +17bp / -16bp jumps at the
  # edges while the 20Y moved +3 / -3). Robustness: GSW curve, or drop the window.
  series_breaks:
    y_30y: [2002-02-19, 2006-02-09]
  suspended_30y_window: [2002-02-19, 2006-02-08]

# Yield-curve factors, all in basis points (yields x 100).
factors:
  units: bp
  level:
    definition: mean of the listed tenors
    tenors: [2Y, 5Y, 10Y, 30Y]
  slope:
    definition: 30Y - 2Y
    long: 30Y
    short: 2Y
  curvature:
    definition: 2*5Y - 2Y - 30Y
    belly: 5Y
    short: 2Y
    long: 30Y

text:
  hf_dataset: vtasca/fomc-statements-minutes
  # Phase 2 (sentence table; ftyields.text.build)
  min_fragment_words: 4     # only pieces shorter than this can be merged as splitter artifacts (no terminal
                            # punctuation / lowercase start / single token, number, enumerator, initials);
                            # complete uppercase-initial sentences of >= 2 words are never merged
  min_sentence_words: 2     # sentences shorter than this (after cleaning) are dropped; 2-3 word sentences are kept
  uid_hex_len: 12           # uid = 'u' + first N hex chars of sha1(norm)
  sample_per_type: 30       # random sentences per doc type in tmp/phase2_samples.md
  extreme_n: 15             # longest / shortest sentences listed in the samples file
  top_uids: 20              # most frequent uids listed in the samples file
  masked_examples: 20       # random masked sentences listed in the samples file

# Event alignment rule:
#   Trading days = dates on which FRED publishes DGS10 (Treasury CMT business days).
#   CMT yields are read from quotes at about 3:30pm ET. A release at ET datetime d
#   maps to event day t = d's date if that is a trading day and the release time is
#   before `yield_close_time_et`; otherwise t = the next trading day after d's date.
#   The event-day change is y(t) - y(t-1), close to close, with t-1 the previous
#   trading day. Statements come out at 2:00pm ET (2:15pm before 2013), so the
#   day-t close contains the reaction; pre-open unscheduled announcements (e.g.
#   2008-01-22 08:20) map to the same day; weekend releases (2020-03-15, a Sunday)
#   map to the next trading day.
events:
  window: close_to_close
  pre_offset_trading_days: -1    # close t-1
  post_offset_trading_days: 0    # close t
  statement_release_time_et: "14:00"   # default when no timestamp is known
  minutes_release_time_et: "14:00"
  yield_close_time_et: "15:30"
  non_trading_day_rule: next_trading_day

# External sources. Files with unclear or non-commercial licenses are downloaded to
# downloads.dir (gitignored) and only their manifest rows are committed.
downloads:
  dir: data/interim/downloads
  manifest: data/raw/MANIFEST.csv
sources:
  fred_csv: https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}
  gsw_csv: https://www.federalreserve.gov/data/yield-curve-tables/feds200628.csv
  bauer_swanson_xlsx: https://www.frbsf.org/wp-content/uploads/monetary-policy-surprises-data.xlsx
  bauer_swanson_sheet: FOMC (update 2023)
  usmpd_xlsx: https://www.frbsf.org/wp-content/uploads/USMPD.xlsx
  usmpd_zip: https://www.frbsf.org/wp-content/uploads/monetary-policy-surprises.zip
  jk_readme: https://raw.githubusercontent.com/marekjarocinski/jkshocks_update_fed/main/README.md
  jk_csv: https://raw.githubusercontent.com/marekjarocinski/jkshocks_update_fed/main/shocks_fed_jk_t.csv
  tdw_hf_dataset: gtfintechlab/fomc_communication
  tdw_master_xlsx: https://raw.githubusercontent.com/gtfintechlab/fomc-hawkish-dovish/main/data/master_files/master_mm_final_Oct_2024.xlsx
  fed_calendar: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
  fed_historical: https://www.federalreserve.gov/monetarypolicy/fomchistorical{year}.htm

# Monetary-policy rate surprise used as the control.
#   Main: Bauer-Swanson (2023) MPS, which ends 2023-12-13, so surprise-controlled
#   statement regressions run through 2023. 2024-2025 and alternative measures are
#   robustness checks. Minutes-release days have no policy action (surprise = 0).
surprise:
  main: bs_mps
  main_last_date: 2023-12-13
  alternatives: [bs_mps_orth, usmpd_stmt, jk_pc1]

scoring:
  roberta_model: gtfintechlab/FOMC-RoBERTa
  batch_size: 1                   # 1 => each sentence is scored alone, so scores cannot depend on batch composition (bs=64 fp32 still moved scores by ~2e-5)
  max_length: 256
  # Verified label order of the published FOMC-RoBERTa head (config.json only has LABEL_0/1/2).
  label_map: {LABEL_0: dovish, LABEL_1: hawkish, LABEL_2: neutral}
  score_text_col: text            # raw (unmasked) text: the model was trained on unmasked FOMC sentences
  fp16: false                     # fp32: scores must not depend on batch composition (fp16 varied by up to 4.5e-3)
  fp16_check_n: 200               # sentences used for the fp16 vs fp32 check
  fp16_max_abs_diff: 0.01         # fall back to fp32 if the max |score diff| exceeds this
  determinism_check_n: 500        # subset rescored to verify that reruns match
  determinism_tol: 1.0e-6
  batch_composition_tol: 1.0e-5   # a subset in different batches must match the full run to this (max abs prob diff)
  summary_examples: 5             # example sentences per extreme in the printout
  strong_abs_score: 0.5           # |score| threshold for the "share strong" summary column
  scores_out: data/processed/roberta_sentence_scores.parquet
  scores_max_commit_mb: 20        # larger outputs go to data/interim instead
  scores_fallback_out: data/interim/roberta_sentence_scores.parquet
  finbert_model: ProsusAI/finbert
  probe_out: results/tables/sentence_probe   # .csv and .tex are written
  probe_sentences:
    - "Employment is strong."
    - "The labor market remains strong and the unemployment rate has declined."
    - "The unemployment rate has risen and job gains have slowed."
    - "Inflation has eased substantially."
    - "Inflation remains elevated."
    - "The Committee decided to raise the target range for the federal funds rate."
    - "The Committee will be patient as it determines future adjustments."
    - "Strains in financial markets have increased."

labelling:
  batch_size: 300
  pilot_n: 100
  gold_n: 350
  human_n: 100
  train_n: 10000
  codebook: codebook/codebook.md
  pilot:
    n_per_round: 100
    statement_weight: 4.0   # statements are 4% of unique sentences; up-weight for the pilot
    policy_weight: 2.0      # policy_like() keyword heuristic
    labelers: [haiku, sonnet, opus-low]
    codebook_versions: [v0, v1, v2]   # codebook used in pilot rounds 1, 2, 3
  codebook_frozen: v2               # git tag codebook-v2
  gold:
    statement_weight: 3.0
    policy_weight: 2.5      # over-sample POLICY-like sentences
    batch_size: 175
    labelers: [sonnet, opus-low, opus-med]   # majority vote = gold; haiku scored separately
  human:
    seed_offset: 200        # human sheet seed = seed + seed_offset (items drawn from the gold set)
    floor: 5                # minimum items per doc_types x policy_like stratum
  train:                    # distillation training set (ftyields.label.train_set)
    seed_offset: 300        # draw seed = seed + seed_offset
    floor: 5                # minimum minutes-only items per doc type x section x era stratum
    labeler: sonnet         # labeler whose labels/out/train/<labeler>/ outputs train the distiller
  tdw:                      # Trillion Dollar Words (gtfintechlab/fomc_communication)
    set: tdw_test           # labelling batch set name (labels/batches/tdw_test)
    batch_size: 250

# Distillation: LLM labels -> local fine-tuned classifier applied to the whole corpus
# (ftyields.model.distill). Slots = {ASSESSMENT, OUTLOOK} x {INFLATION, LABOR, ACTIVITY,
# FINANCIAL, GENERAL} + POLICY; per slot a presence logit and 5 direction logits (-2..2).
distill:
  encoder: gtfintechlab/FOMC-RoBERTa   # or roberta-base
  max_length: 256                      # prev_text </s></s> text, tokens (truncation is reported)
  lambda_dir: 1.0                      # loss = mean BCE(presence) + lambda * masked CE(direction)
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_frac: 0.1
  epochs: 6
  patience: 2                          # early stopping: epochs without validation improvement
  batch_size: 4                        # per step; effective batch = batch_size * grad_accum (worst case 4x256 tokens peaks at 6.9 GiB for RoBERTa-large)
  grad_accum: 8
  freeze_embeddings: false             # saves ~0.6 GiB if memory is tight
  grad_checkpointing: false            # saves ~1 GiB at batch 8 (about 30% slower)
  amp: true                            # fp16 autocast for TRAINING only; inference is fp32
  test_years: [2003, 2009, 2014, 2019, 2023]
  val_years: [2006, 2017]
  random_split: {train: 0.8, val: 0.1, test: 0.1}   # optimistic comparison split (seed + 301)
  threshold: 0.5                       # presence probability threshold for the predicted label
  infer_batch_size: 1                  # fp32, one sentence at a time => independent of batch composition
  batch_check_n: 500                   # sentences rescored in other batches / reruns for the checks
  batch_check_tol: 1.0e-5
  model_dir: models/distill            # weights (gitignored)
  out: data/processed/distilled_labels.parquet
  max_commit_mb: 20
  fallback_out: data/interim/distilled_labels.parquet
  tables: results/tables
  smoke_encoder: roberta-base          # --smoke: falls back to FOMC-RoBERTa if unavailable
  smoke_epochs: 2
  smoke_infer_n: 200

analysis:
  lp_horizons:            # local projections, horizons in trading days
    start: 0
    end: 60
  hac_lags:
    rule: null            # TBD (phase 8): Newey-West lag rule tied to horizon
  forecast_horizons: []   # TBD (phase 9): meeting-to-meeting plus several horizons
